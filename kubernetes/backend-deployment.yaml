apiVersion: apps/v1
kind: Deployment
metadata:
  name: omega-beauty-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omega-beauty-backend
  template:
    metadata:
      labels:
        app: omega-beauty-backend
    spec:
      containers:
        - name: backend
          image: omega-beauty-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: CLIENT_ORIGIN
              value: "http://localhost"
            - name: JWT_SECRET
              value: "change-me-in-production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omega-beauty-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: omega-beauty-backend
spec:
  selector:
    app: omega-beauty-backend
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
